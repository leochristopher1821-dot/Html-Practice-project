<html>

<head>
    <title>EMC Register</title>
    <link rel="icon" href="emc.png">
</head>

<body>
    <center>
        <h1>Error Makes Clever Academy🚀</h1>
        <h3>Training / Tech news / Fresher Guide</h3>
        <p>Empowering young developers to level up their skills through training in software development
            technologies🧑‍💻
        </p>
    </center>
    <hr>
    <center>
        <h2>Registration Form</h2>
        <table>
            <tr>
                <td>Name:</td>
                <td><input type="text"></td>
            </tr>
            <tr>
                <td>Age:</td>
                <td><input type="number"></td>
            </tr>
            <tr>
                <td>Gender:</td>
                <td>
                    <input type="radio">Male
                    <input type="radio">Female
                </td>
            </tr>
            <tr>
                <td>Email:</td>
                <td><Input type="email"></td>
            </tr>
            <tr>
                <td>Select a Course:</td>
                <td>
                    <select>
                        <option>Fullstack</option>
                        <option>Digital-Marketing</option>
                        <option>Cyber-security</option>
                    </select>
                </td>
            </tr>
            <tr>
                <td>Upload your Resume:</td>
                <td><input type="file"></td>
            </tr>
            <tr>
                <td></td>
                <td>
                    <input type="submit">
                    <input type="Reset">
                </td>
            </tr>

        </table><hr>
        <p>
            <a href="index.html">Home</a>
        </p>
    </center><hr>


</body>

</html>
